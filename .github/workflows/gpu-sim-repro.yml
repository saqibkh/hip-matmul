name: f16 repro
on:
  push:
    branches: [ f16-repro ]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.2"
      - run: sudo apt-get install -y comgr hsa-rocr
      - run: hipcc matmul.hip -std=c++20 -O2 --offload-arch=gfx942 -o hm
      - name: A. only 20x20x20, diag, no abort
        run: |
          M=256 N=256 K=256 FIXED_ITERATIONS=1 ONLY20=1 DIAG=1 DIAG_NOABORT=1 TWICE=1 FILTER='mfma_f32_16x16x16f16_shared_Kx2<8, 8>' vgpu run ./hm </dev/null 2>&1 | grep -E "DIAG|numerical|OK" | head -80 || true
      - name: B. all shapes, diag, no abort
        run: |
          M=256 N=256 K=256 FIXED_ITERATIONS=1 DIAG=1 DIAG_NOABORT=1 FILTER='mfma_f32_16x16x16f16_shared_Kx2<8, 8>' vgpu run ./hm </dev/null 2>&1 | grep -E "DIAG outer .*blocks wrong|numerical|OK" | head -80 || true
      - name: C. same, other kernel (non-Kx2 shared) for comparison
        run: |
          M=256 N=256 K=256 FIXED_ITERATIONS=1 ONLY20=1 DIAG=1 DIAG_NOABORT=1 FILTER='mfma_f32_16x16x16f16_shared<8, 8>' vgpu run ./hm </dev/null 2>&1 | grep -E "DIAG|numerical|OK" | head -40 || true
