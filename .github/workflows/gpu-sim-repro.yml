name: f16 repro
on:
  push:
    branches: [ f16-repro ]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: amd/mi300x
          cuda-toolkit: none
          rocm: "7.2"
      - run: sudo apt-get install -y comgr hsa-rocr
      - name: CPU emulation of the StreamKTree control flow
        run: g++ -std=c++20 -O1 f16repro/emu.cc -o emu && ./emu
